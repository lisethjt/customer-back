name: publish jar as artifact
on:
  repository_dispatch:
    types: [publish-artifact-event]
jobs:
  download-artifact-job:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_NAME: 'customer-0.0.1-SNAPSHOT.jar'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Debug Payload
        run: |          
          echo ${{ github.event.client_payload.base_branch }}

#1 - Download the source code
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.event.client_payload.base_branch }}
          fetch-depth: 0
      
      - name: check last hashid
        run: |
          git log -2

#2 - Setup Java 17
      - name: setup java 17 
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin' # See 'Supported distributions' for available options
          java-version: '17'
      
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Build with Maven
        run: |
          mvn clean test package -DskipTests=true --batch-mode --update-snapshots
          echo ls -R target/
          echo ls -la

#4 - Public it as artifact
      - name: Publish Package as artifact
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: artifactjar                  
          path: ${{ github.workspace }}/target/${{ env.ARTIFACT_NAME }}