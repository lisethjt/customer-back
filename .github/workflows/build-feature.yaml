name: Build Feature Branch

on:
  pull_request:
     branches: [ develop ]
     types: [ opened, reopened ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha }} # descargar el código de la rama de feature

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Build with Maven
        run: |
          mvn clean test package
          echo "building feature branch"

  merge-feature-into-develop:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ success() }}
    #[For a specific job, you can use jobs.<job_id>.permissions to modify the default permissions granted to the GITHUB_TOKEN](https://docs.github.com/en/actions/using-jobs/assigning-permissions-to-jobs)
    permissions:
      contents: write
      pull-requests: write 
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: ${{ github.base_ref }} # descargar el código de la rama de base (develop)
          fetch-depth: 0 # descargar todo el historial de commits 
# 2 -merge to development branch
      - name: Merge to develop branch
        if: ${{ success() }}
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "ljimeneztorres@gmail.com"
          git merge --no-ff --verbose origin/${{ github.event.pull_request.head.ref }} -m "Merge pull request ${{ github.event.number }} into develop"

# 3- push to develop branch
      - name: Push changes after merge
        if: ${{ success() }}
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.base_ref }}

#4 - call publish-jar-as-artifact workflow
      - name: trigger deploy artifact
        if: ${{ success() }}
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          event-type: publish-artifact-event
          client-payload: '{"base_branch":"${{ github.base_ref }}"}'    